name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit (optional)
  workflow_dispatch:
  push: {branches: ["main"]}

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # NOTE: achievements & habits are generated ONCE as static SVGs (real data),
  # committed directly, and intentionally NOT regenerated here - the lowlighter
  # plugins crash for this account (deprecated Projects-classic API / habits bug).

  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Header
        uses: lowlighter/metrics@latest
        with:
          filename: header.svg
          # Prefer the PAT when configured, otherwise use the workflow token.
          token: ${{ secrets.METRICS_SECRET || secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: Haseeb-1698
          template: classic
          base: header
          config_timezone: Asia/Karachi

      - name: Activity and community
        uses: lowlighter/metrics@latest
        with:
          filename: acti_comm.svg
          # Prefer the PAT when configured, otherwise use the workflow token.
          token: ${{ secrets.METRICS_SECRET || secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: Haseeb-1698
          template: classic
          base: activity, community
          config_timezone: Asia/Karachi

      - name: ISO calendar
        uses: lowlighter/metrics@latest
        with:
          filename: iso_calender.svg
          # Prefer the PAT when configured, otherwise use the workflow token.
          token: ${{ secrets.METRICS_SECRET || secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: Haseeb-1698
          template: classic
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Issues, pull requests, and languages
        uses: lowlighter/metrics@latest
        with:
          filename: issue_pr_lang.svg
          # Prefer the PAT when configured, otherwise use the workflow token.
          token: ${{ secrets.METRICS_SECRET || secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: Haseeb-1698
          template: classic
          base: ""
          config_timezone: Asia/Karachi
          plugin_followup: yes
          plugin_languages: yes

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          filename: repositories.svg
          # Prefer the PAT when configured, otherwise use the workflow token.
          token: ${{ secrets.METRICS_SECRET || secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: Haseeb-1698
          template: classic
          base: repositories
          config_timezone: Asia/Karachi
