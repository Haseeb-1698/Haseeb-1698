name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit (optional)
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # NOTE: achievements & habits are generated ONCE as static SVGs (real data),
  # committed directly, and intentionally NOT regenerated here - the lowlighter
  # plugins crash for this account (deprecated Projects-classic API / habits bug).

  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Create a repository secret named METRICS_TOKEN with a valid GitHub PAT. The built-in github.token is repository-scoped and produces incomplete profile metrics."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" https://api.github.com/user > /dev/null || {
            echo "::error::METRICS_TOKEN is invalid or expired. Replace it with a valid GitHub PAT."
            exit 1
          }

      - name: Header
        uses: lowlighter/metrics@latest
        with:
          filename: header.svg
          # METRICS_TOKEN is used to collect account-wide data.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is only used to commit generated SVGs to this repository.
          committer_token: ${{ github.token }}

          # Options
          user: Haseeb-1698
          template: classic
          base: header
          config_timezone: Asia/Karachi

      - name: Activity and community
        uses: lowlighter/metrics@latest
        with:
          filename: acti_comm.svg
          # METRICS_TOKEN is used to collect account-wide data.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is only used to commit generated SVGs to this repository.
          committer_token: ${{ github.token }}

          # Options
          user: Haseeb-1698
          template: classic
          base: activity, community
          config_timezone: Asia/Karachi

      - name: ISO calendar
        uses: lowlighter/metrics@latest
        with:
          filename: iso_calender.svg
          # METRICS_TOKEN is used to collect account-wide data.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is only used to commit generated SVGs to this repository.
          committer_token: ${{ github.token }}

          # Options
          user: Haseeb-1698
          template: classic
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Issues, pull requests, and languages
        uses: lowlighter/metrics@latest
        with:
          filename: issue_pr_lang.svg
          # METRICS_TOKEN is used to collect account-wide data.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is only used to commit generated SVGs to this repository.
          committer_token: ${{ github.token }}

          # Options
          user: Haseeb-1698
          template: classic
          base: ""
          config_timezone: Asia/Karachi
          plugin_followup: yes
          plugin_languages: yes

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          filename: repositories.svg
          # METRICS_TOKEN is used to collect account-wide data.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is only used to commit generated SVGs to this repository.
          committer_token: ${{ github.token }}

          # Options
          user: Haseeb-1698
          template: classic
          base: repositories
          config_timezone: Asia/Karachi
